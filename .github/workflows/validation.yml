name: Validation eLearning
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elearning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lire la version compatible
        id: compatibility
        run: python3 -c 'import json; c=json.load(open("compatibility.json")); print("commit=" + c["training_management"]["commit"]); print("previous=" + c["previous_elearning_commit"]); print("relocation_tm=" + c["module_relocation_baseline"]["tm_commit"]); print("relocation_el=" + c["module_relocation_baseline"]["elearning_commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management
          ref: ${{ steps.compatibility.outputs.commit }}
          path: .dependencies/training_management
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management_elearning
          ref: ${{ steps.compatibility.outputs.previous }}
          path: .dependencies/elearning_previous
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management
          ref: ${{ steps.compatibility.outputs.relocation_tm }}
          path: .dependencies/tm_relocation_previous
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management_elearning
          ref: ${{ steps.compatibility.outputs.relocation_el }}
          path: .dependencies/adapter_previous
          persist-credentials: false
      - name: Régressions JavaScript
        env:
          TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/training_management/addons
        run: |
          node bench/review/parent.test.cjs
          node bench/review/runner.test.cjs
      - name: Installation et mise à jour Odoo réelles
        env:
          TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/training_management/addons
          LMS_SECRET_DIR: ${{ runner.temp }}/elearning-secrets
          LMS_COMPOSE_PROJECT: elearning-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash ci/validate.sh
      - name: Cours autonomes sans TM — installation et conservation
        env:
          TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/training_management/addons
        run: python3 ci/validate-autonomous.py
      - name: Conservation des preuves de la génération précédente
        env:
          TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/training_management/addons
          PREVIOUS_EL_ADDONS_DIR: ${{ github.workspace }}/.dependencies/elearning_previous/addons
        run: python3 ci/validate-generations.py
      - name: Déplacement technique de l’adaptateur TM et conservation
        env:
          TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/training_management/addons
          PREVIOUS_TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/tm_relocation_previous/addons
          PREVIOUS_ADAPTER_ADDONS_DIR: ${{ github.workspace }}/.dependencies/adapter_previous/addons
        run: python3 ci/validate-module-relocation.py
      - name: Journaux de validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-elearning
          path: ci-results/
          if-no-files-found: error

  release_qualification:
    name: Composition complète et restauration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lire la composition et la génération précédente
        id: release
        run: python3 -c 'import json; c=json.load(open("compatibility.json")); print("tm=" + c["training_management"]["commit"]); print("legacy_tm=" + c["legacy_release_baseline"]["tm_commit"]); print("legacy_el=" + c["legacy_release_baseline"]["elearning_commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management
          ref: ${{ steps.release.outputs.tm }}
          path: .dependencies/training_management
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management
          ref: ${{ steps.release.outputs.legacy_tm }}
          path: .dependencies/tm_release_previous
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management_elearning
          ref: ${{ steps.release.outputs.legacy_el }}
          path: .dependencies/el_release_previous
          persist-credentials: false
      - name: Installer tous les addons, mettre à jour et restaurer leurs fichiers
        env:
          TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/training_management/addons
          PREVIOUS_RELEASE_TM_ADDONS_DIR: ${{ github.workspace }}/.dependencies/tm_release_previous/addons
          PREVIOUS_RELEASE_EL_ADDONS_DIR: ${{ github.workspace }}/.dependencies/el_release_previous/addons
        run: python3 ci/validate-final-release.py
      - name: Preuves de qualification et restauration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-complete-restauration
          path: ci-results/final-release/
          if-no-files-found: error

  private_resources:
    name: Ressources privées, conservation et restauration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lire le commit Training Management compatible
        id: resources
        run: python3 -c 'import json; print("tm=" + json.load(open("compatibility.json"))["training_management"]["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Progideo/training_management
          ref: ${{ steps.resources.outputs.tm }}
          path: .dependencies/training_management
          persist-credentials: false
      - name: Télécharger les images épinglées du banc
        run: |
          python3 - <<'PYTHON'
          import runpy
          import subprocess

          bench = runpy.run_path("bench/test-resources.py")
          for name in ("IMAGE", "POSTGRES"):
              subprocess.run(["docker", "pull", bench[name]], check=True)
          PYTHON
      - name: Tester les ressources privées dans la composition complète
        run: |
          python3 bench/test-resources.py --full-composition \
            --shared-addons .dependencies/training_management/addons \
            --output "${RUNNER_TEMP}/elearning-resource-results"
      - name: Journaux de qualification des ressources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-ressources-privees
          path: |
            ${{ runner.temp }}/elearning-resource-results/*.log
            ${{ runner.temp }}/elearning-resource-results/success.json
          if-no-files-found: error
